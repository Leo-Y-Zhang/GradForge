[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gradforge"
version = "0.1.0"
description = "A from-scratch reverse-mode autograd engine and a tiny GPT that prove their own gradients"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Leo Y. Zhang" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["gradforge"]

[tool.setuptools.package-data]
gradforge = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
